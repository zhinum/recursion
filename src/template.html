<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STARTER</title>
  </head>
  <body>
    <script>
      function permutations(array) {
        // base case
        if (array.length === 0) {
          return [[]];
        }
        const arrayResult = [];

        for (let i = 0; i < array.length; i++) {
          const currentPosition = array[i];

          const remainingPositions = array
            .slice(0, i)
            .concat(array.slice(i + 1));

          const recursedPermutaions = permutations(remainingPositions);

          for (const perms of recursedPermutaions) {
            arrayResult.push([currentPosition, ...perms]);
          }
        }
        return arrayResult;
      }

      console.log(permutations([1, 2, 3, 4]));

      function fibionacci(num) {
        if (num <= 0) return [0];
        if (num === 1) return [0, 1];

        let prevSequence = fibionacci(num - 1);

        let sequence =
          prevSequence[prevSequence.length - 1] +
          prevSequence[prevSequence.length - 2];

        return [...prevSequence, sequence];
      }

      console.log(fibionacci(8));
    </script>
  </body>
</html>
